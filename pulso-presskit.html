<!DOCTYPE html>
<!-- @dsCard group="UI Kit — Presskit" name="UI Kit — Press Kit" subtitle="Press kit one-pager + team + social templates (story/feed/reel)" viewport="1280x560" -->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PULSO — Press Kit · UI Kit</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root{--n:#0a0a0a;--b:#f4f2ed;--r:#c8392b;--g:#6b6862;--g2:#1e1e1e;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--n);color:var(--b);font-family:'DM Sans',sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;overflow-x:hidden;cursor:crosshair;}

/* HERO */
.pk-hero{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;}
.pk-hero-l{padding:clamp(48px,7vw,96px) clamp(32px,5vw,72px);display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--g2);}
.pk-hero-eyebrow{font-size:9px;letter-spacing:.4em;text-transform:uppercase;color:var(--r);margin-bottom:32px;}
.pk-hero-logo{font-family:'Bebas Neue',sans-serif;font-size:clamp(100px,15vw,190px);line-height:.85;letter-spacing:.03em;}
.pk-hero-logo span{color:var(--r);}
.pk-hero-sub{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--g);margin-top:20px;line-height:2.2;}
.pk-hero-launch{display:inline-flex;align-items:center;gap:12px;padding:10px 20px;border:1px solid var(--g2);}
.pk-ldot{width:6px;height:6px;border-radius:50%;background:var(--r);animation:pulse 2s ease infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
.pk-ltxt{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--g);}
.pk-hero-r{position:relative;background:#0e0c0a;overflow:hidden;}
.pk-hero-r img{width:100%;height:100%;object-fit:cover;object-position:center;filter:brightness(.62);display:block;}
.pk-hero-r-caption{position:absolute;bottom:0;left:0;right:0;padding:32px 28px;background:linear-gradient(transparent,rgba(10,10,10,.96) 60%);}
.pk-cap-sec{font-size:8px;letter-spacing:.38em;text-transform:uppercase;color:var(--r);margin-bottom:6px;}
.pk-cap-name{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.04em;line-height:1;}
.pk-cap-sub{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--g);margin-top:5px;}

/* TICKER */
.pk-ticker{background:var(--r);overflow:hidden;white-space:nowrap;padding:9px 0;}
.pk-ticker-track{display:inline-flex;animation:tick 28s linear infinite;}
.pk-ticker-track span{font-size:9px;letter-spacing:.28em;text-transform:uppercase;padding:0 28px;color:var(--b);}
.pk-ticker-track span.dot{padding:0;color:rgba(244,242,237,.4);}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* SECCIONES */
.pk-sec{padding:clamp(64px,8vw,100px) clamp(32px,5vw,80px);}
.pk-sec-label{font-size:8px;letter-spacing:.42em;text-transform:uppercase;color:var(--r);margin-bottom:16px;}
.pk-sec-titulo{font-family:'Bebas Neue',sans-serif;font-size:clamp(44px,6vw,72px);letter-spacing:.03em;line-height:.9;}

/* MANIFIESTO */
.pk-manif{background:#0d0d0d;border-top:1px solid var(--g2);border-bottom:1px solid var(--g2);}
.pk-manif-inner{max-width:880px;margin:0 auto;padding:clamp(64px,8vw,100px) clamp(32px,5vw,80px);}
.pk-manif-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(40px,6vw,72px);letter-spacing:.03em;line-height:.9;margin-bottom:12px;}
.pk-manif-italic{font-size:clamp(16px,2vw,22px);font-style:italic;color:var(--g);margin-bottom:40px;line-height:1.6;}
.pk-manif-body{columns:2;column-gap:52px;font-size:13px;color:#b8b4ac;line-height:1.9;border-left:2px solid var(--r);padding-left:28px;}
.pk-manif-body p{margin-bottom:16px;break-inside:avoid;}

/* PREVIEW */
.pk-preview-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:1px;background:var(--g2);margin-top:44px;}
.pk-prev-card{background:var(--n);position:relative;overflow:hidden;min-height:360px;}
.pk-prev-card img{width:100%;height:100%;min-height:360px;object-fit:cover;display:block;filter:brightness(.7);transition:transform .5s ease;}
.pk-prev-card:hover img{transform:scale(1.03);}
.pk-prev-overlay{position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(10,10,10,.95));display:flex;flex-direction:column;justify-content:flex-end;padding:24px 22px;pointer-events:none;}
.pk-prev-sec{font-size:8px;letter-spacing:.35em;text-transform:uppercase;color:var(--r);margin-bottom:6px;}
.pk-prev-title{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.04em;line-height:1;}
.pk-prev-sub{font-size:9px;color:var(--g);margin-top:5px;letter-spacing:.1em;}

/* FORMATO */
.pk-formato{background:#0d0d0d;border-top:1px solid var(--g2);}
.pk-fmt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--g2);margin-top:44px;}
.pk-fmt-item{background:var(--n);padding:32px 26px;transition:background .15s;}
.pk-fmt-item:hover{background:#0f0f0f;}
.pk-fmt-num{font-family:'Bebas Neue',sans-serif;font-size:48px;color:var(--g2);line-height:1;margin-bottom:10px;}
.pk-fmt-tipo{font-size:8px;letter-spacing:.3em;text-transform:uppercase;color:var(--r);margin-bottom:6px;}
.pk-fmt-nombre{font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:.04em;line-height:1.1;margin-bottom:8px;}
.pk-fmt-desc{font-size:11px;color:var(--g);line-height:1.8;}

/* EQUIPO */
.pk-eq-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--g2);margin-top:44px;}
.pk-eq-card{background:var(--n);overflow:hidden;}
.pk-eq-img{width:100%;aspect-ratio:3/4;display:block;overflow:hidden;}
.pk-eq-img img{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(.92);transition:transform .5s ease;}
.pk-eq-card:hover .pk-eq-img img{transform:scale(1.04);}
.pk-eq-info{padding:28px 24px;}
.pk-eq-rol{font-size:8px;letter-spacing:.32em;text-transform:uppercase;color:var(--r);margin-bottom:10px;}
.pk-eq-nombre{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.04em;line-height:1;margin-bottom:10px;}
.pk-eq-desc{font-size:11px;color:var(--g);line-height:1.8;}
.pk-studio-bar{background:#0d0d0d;border:1px solid var(--g2);margin-top:1px;padding:32px;display:flex;align-items:center;gap:28px;flex-wrap:wrap;}
.pk-studio-nombre{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.05em;}
.pk-studio-sep{width:1px;height:36px;background:var(--g2);}
.pk-studio-desc{font-size:11px;color:var(--g);line-height:1.8;max-width:520px;}

/* ALCANCE */
.pk-alcance{background:#0d0d0d;border-top:1px solid var(--g2);}
.pk-alc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--g2);margin-top:44px;}
.pk-alc-item{background:var(--n);padding:32px 26px;}
.pk-alc-tipo{font-size:8px;letter-spacing:.3em;text-transform:uppercase;color:var(--r);margin-bottom:14px;}
.pk-alc-big{font-family:'Bebas Neue',sans-serif;font-size:44px;letter-spacing:.03em;line-height:.95;margin-bottom:14px;}
.pk-alc-big span{color:var(--r);}
.pk-alc-desc{font-size:11px;color:var(--g);line-height:1.8;}

/* ACREDITACIÓN */
.pk-acred-head{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:end;}
.pk-acred-intro{font-size:13px;color:#b8b4ac;line-height:1.9;}
.pk-acred-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--g2);margin-top:44px;border:1px solid var(--g2);}
.pk-acred-card{background:var(--n);padding:30px 24px;}
.pk-acred-n{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--g2);line-height:1;margin-bottom:14px;}
.pk-acred-t{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.04em;line-height:1.1;margin-bottom:12px;}
.pk-acred-d{font-size:11px;color:var(--g);line-height:1.8;}
.pk-acred-ask{margin-top:44px;border:1px solid var(--r);padding:40px 36px;display:grid;grid-template-columns:1fr 1.4fr;gap:32px;align-items:center;}
.pk-acred-ask-t{font-family:'Bebas Neue',sans-serif;font-size:clamp(28px,4vw,44px);letter-spacing:.03em;line-height:.95;color:var(--b);}
.pk-acred-ask-d{font-size:13px;color:#b8b4ac;line-height:1.85;}
.pk-acred-ask-d b{color:var(--b);font-weight:400;}

/* SOCIAL */
.pk-social{border-top:1px solid var(--g2);}
.pk-social-lead{font-size:13px;color:#b8b4ac;line-height:1.85;max-width:600px;margin-top:18px;}
.pk-soc-grid{display:flex;gap:32px;margin-top:44px;flex-wrap:wrap;align-items:flex-start;}
.pk-soc-label{font-size:8px;letter-spacing:.3em;text-transform:uppercase;color:var(--g);margin-bottom:12px;}
.pk-soc{position:relative;overflow:hidden;background:#0e0c0b;display:flex;flex-direction:column;border:1px solid var(--g2);}
.pk-soc.story{width:240px;aspect-ratio:9/16;}
.pk-soc.feed{width:320px;aspect-ratio:1/1;}
.pk-soc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.55);}
.pk-soc-top{position:relative;z-index:2;padding:18px;display:flex;justify-content:space-between;align-items:flex-start;}
.pk-soc-logo{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.06em;line-height:1;}.pk-soc-logo span{color:var(--r);}
.pk-soc-tk{position:relative;z-index:2;background:var(--r);padding:5px 0;overflow:hidden;white-space:nowrap;}
.pk-soc-tk span{font-size:7px;letter-spacing:.24em;text-transform:uppercase;color:var(--b);padding:0 12px;}
.pk-soc-bottom{position:relative;z-index:2;margin-top:auto;padding:20px 18px;background:linear-gradient(transparent,rgba(10,10,10,.94));}
.pk-soc-sec{font-size:7px;letter-spacing:.32em;text-transform:uppercase;color:var(--r);margin-bottom:6px;}
.pk-soc-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.03em;line-height:.92;margin-bottom:8px;}
.pk-soc-meta{font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--g);}

/* CONTACTO */
.pk-ct-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--g2);margin-top:44px;border:1px solid var(--g2);}
.pk-ct-block{background:var(--n);padding:36px 32px;}
.pk-ct-block.dark{background:#0d0d0d;}
.pk-ct-label{font-size:8px;letter-spacing:.38em;text-transform:uppercase;color:var(--r);margin-bottom:16px;}
.pk-ct-dato{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.04em;margin-bottom:6px;line-height:1.2;}
.pk-ct-sub{font-size:10px;color:var(--g);letter-spacing:.12em;}
.pk-ct-nota{font-size:12px;color:#b8b4ac;line-height:1.8;margin-top:8px;}

footer{border-top:1px solid var(--g2);padding:28px clamp(32px,5vw,80px);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.pk-ft-brand{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.1em;}.pk-ft-brand span{color:var(--r);}
.pk-ft-txt{font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:var(--g);}

@media(max-width:760px){.pk-hero{grid-template-columns:1fr;}.pk-manif-body{columns:1;}.pk-preview-grid,.pk-fmt-grid,.pk-eq-grid,.pk-alc-grid,.pk-acred-grid,.pk-ct-grid{grid-template-columns:1fr;}.pk-acred-head,.pk-acred-ask{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="Equipo.jsx"></script>
<script type="text/babel" src="Social.jsx"></script>
<script type="text/babel">
const PH = '../../assets/photography/';
const TICK = ['Revista de danza mexicana','Acreditación de prensa','Fotografía & video No\'j Studio','Lanzamiento Noviembre 2026'];

function Hero() {
  return (
    <section className="pk-hero">
      <div className="pk-hero-l">
        <div className="pk-hero-eyebrow">Press Kit · by No'j Studio</div>
        <div>
          <div className="pk-hero-logo">PUL<br />SO<span>·</span></div>
          <div className="pk-hero-sub">Revista digital de danza mexicana<br />Contemporánea · Clásica · Folclórica</div>
        </div>
        <div className="pk-hero-launch">
          <span className="pk-ldot"></span>
          <span className="pk-ltxt">Lanzamiento · Número 01 · Noviembre 2026</span>
        </div>
      </div>
      <div className="pk-hero-r">
        <img src={PH + 'contemporaneo-rojo.jpg'} alt="" />
        <div className="pk-hero-r-caption">
          <div className="pk-cap-sec">Número 01 · Día de Muertos</div>
          <div className="pk-cap-name">La danza que<br />vuelve a la vida</div>
          <div className="pk-cap-sub">Producción No'j Studio · CDMX</div>
        </div>
      </div>
    </section>
  );
}

const PREVIEWS = [
  { img: PH + 'dia-de-muertos-duo.jpg', sec: 'Fotoensayo del número', title: 'Día de Muertos<br />en escena', sub: 'Número 01 · Noviembre 2026' },
  { img: PH + 'contemporaneo-pasillo.jpg', sec: 'Entrevista de portada', title: '"La danza no<br />espera permiso"', sub: 'Figura dancística nacional' },
  { img: PH + 'folclorico-blanco.jpg', sec: 'Raíz · Folclórica', title: 'La tradición como<br />lenguaje vivo', sub: 'Número 01 · Noviembre 2026' },
];

const FORMATO = [
  ['01','Portada + Editorial','Carta de apertura','La voz de los directores. Por qué PULSO, a quién le habla, qué viene.'],
  ['02','Entrevista de portada','"La danza no espera permiso"','Figura del medio nacional. Sesión fotográfica No\'j. 4 preguntas sin recortar.'],
  ['03','Video exclusivo','Antes de que llegues tarde','Adelanto de función en video. Producción No\'j. El FOMO encapsulado.'],
  ['04','Agenda mensual','Lo que no te puedes perder','Funciones, talleres y audiciones de danza en CDMX. Actualizable semanalmente.'],
  ['05','Perfil emergente','El nombre que seguir','Spotlight a bailarín o coreógrafo en ascenso. Retrato editorial No\'j.'],
  ['06','Galería','Ya fue — Cobertura fotográfica','Registro visual de función reciente. El archivo que nadie más está haciendo.'],
  ['07','Fotoensayo','Día de Muertos en escena','La muerte como motor coreográfico en la danza mexicana.'],
  ['08','Reseña de función','Crónica desde la butaca','Crítica honesta y cercana de un estreno del mes. Sin solemnidad, con criterio.'],
  ['09','Voz invitada','Columna del mes','Una mirada externa que aporta perspectiva a la escena.'],
];

const ALCANCE = [
  ['Formato','100%<br />digital','Revista digital de acceso abierto. Edición impresa de colección para aliados.'],
  ['Periodicidad','12<br />al año','Un número mensual con presencia semanal en redes. Cobertura viva, no archivo muerto.'],
  ['Foco','Danza<span>·</span>','Contemporánea, clásica y folclórica mexicana. El único medio dedicado por completo.'],
  ['Producido por','No\'j<br />Studio<span>·</span>','Estudio de foto y video en CDMX. Produce todo el contenido visual de PULSO.'],
];

const ACRED = [
  ['01','Cobertura fotográfica<br />y de video','Registramos la función con producción No\'j Studio. El material queda disponible para la institución y los artistas, sin restricción de uso.'],
  ['02','Difusión editorial<br />y en redes','Reseña, agenda y presencia en la revista y en redes — antes, durante y después del evento. Atraemos público nuevo al teatro.'],
  ['03','Entrevistas y<br />perfiles de artistas','Damos voz a bailarines, coreógrafos y compañías con sesiones editoriales y entrevistas a fondo, sin recortes ni prisa.'],
  ['04','Archivo vivo de<br />la escena','Construimos el registro visual que casi nadie está haciendo: memoria de la danza mexicana de esta época.'],
];

function App() {
  return (
    <React.Fragment>
      <Hero />
      <div className="pk-ticker"><div className="pk-ticker-track">
        {[...TICK, ...TICK].map((s, i) => <React.Fragment key={i}><span>{s}</span><span className="dot">·</span></React.Fragment>)}
      </div></div>

      <section className="pk-manif">
        <div className="pk-manif-inner">
          <div className="pk-sec-label">Manifiesto</div>
          <div className="pk-manif-title">La danza<br />ocurre una vez.</div>
          <div className="pk-manif-italic">No somos una publicación sobre danza. Somos el registro vivo de algo que merece ser visto.</div>
          <div className="pk-manif-body">
            <p>No hay segunda toma, no hay versión definitiva, no hay archivo que la contenga del todo. Cada función es un acontecimiento irrepetible — cuerpos en el espacio, tiempo real, presencia compartida.</p>
            <p>PULSO nace de esa convicción. Cada imagen, cada video, cada palabra tiene un solo propósito: que quien los encuentre sienta que hay algo ocurriendo en esta ciudad demasiado grande para perdérselo.</p>
            <p>Creemos que todos merecen ser vistos, y que el público que los merece existe — solo necesita saber dónde mirar. Una brújula para el que ya va al teatro, y una puerta para el que todavía no sabe que quiere ir.</p>
          </div>
        </div>
      </section>

      <section className="pk-sec">
        <div className="pk-sec-label">Adelanto · Número 01</div>
        <div className="pk-sec-titulo">Lo que verás<br />en noviembre.</div>
        <div className="pk-preview-grid">
          {PREVIEWS.map((p, i) => (
            <div className="pk-prev-card" key={i}>
              <img src={p.img} alt="" />
              <div className="pk-prev-overlay">
                <div className="pk-prev-sec">{p.sec}</div>
                <div className="pk-prev-title" dangerouslySetInnerHTML={{ __html: p.title }}></div>
                <div className="pk-prev-sub">{p.sub}</div>
              </div>
            </div>
          ))}
        </div>
      </section>

      <section className="pk-sec pk-formato">
        <div className="pk-sec-label">Contenido · Número 01</div>
        <div className="pk-sec-titulo">9 piezas.<br />Cada una cuenta.</div>
        <div className="pk-fmt-grid">
          {FORMATO.map((f, i) => (
            <div className="pk-fmt-item" key={i}>
              <div className="pk-fmt-num">{f[0]}</div>
              <div className="pk-fmt-tipo">{f[1]}</div>
              <div className="pk-fmt-nombre">{f[2]}</div>
              <div className="pk-fmt-desc">{f[3]}</div>
            </div>
          ))}
        </div>
      </section>

      <Equipo />

      <section className="pk-sec pk-alcance">
        <div className="pk-sec-label">El medio</div>
        <div className="pk-sec-titulo">Qué es PULSO</div>
        <div className="pk-alc-grid">
          {ALCANCE.map((a, i) => (
            <div className="pk-alc-item" key={i}>
              <div className="pk-alc-tipo">{a[0]}</div>
              <div className="pk-alc-big" dangerouslySetInnerHTML={{ __html: a[1] }}></div>
              <div className="pk-alc-desc">{a[2]}</div>
            </div>
          ))}
        </div>
      </section>

      <section className="pk-sec">
        <div className="pk-acred-head">
          <div>
            <div className="pk-sec-label">Para instituciones y compañías</div>
            <div className="pk-sec-titulo">Acreditación<br />de prensa</div>
          </div>
          <div className="pk-acred-intro">PULSO está en producción de su primer número y construyendo su archivo de cobertura. Solicitamos acceso de prensa a funciones, ensayos y temporadas para documentarlos con calidad editorial. A cambio, la institución recibe cobertura profesional y difusión — sin costo y sin condiciones.</div>
        </div>
        <div className="pk-acred-grid">
          {ACRED.map((a, i) => (
            <div className="pk-acred-card" key={i}>
              <div className="pk-acred-n">{a[0]}</div>
              <div className="pk-acred-t" dangerouslySetInnerHTML={{ __html: a[1] }}></div>
              <div className="pk-acred-d">{a[2]}</div>
            </div>
          ))}
        </div>
        <div className="pk-acred-ask">
          <div className="pk-acred-ask-t">Lo único que pedimos es entrar.</div>
          <div className="pk-acred-ask-d">Acceso de prensa para fotografiar y grabar. <b>Todo lo demás lo ponemos nosotros</b> — equipo, producción, edición y difusión. El objetivo es uno solo: que la danza mexicana se vea.</div>
        </div>
