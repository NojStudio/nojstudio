<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ciclismo Marroquino</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
/* ============================================================
   CICLISMO MARROQUINO — Foundations
   colors_and_type.css
   Brand colors lifted from the shop logo:
     teal  #0295A5   ·   lime  #ADEF1C
   Fonts loaded from Google Fonts (see README — flagged substitution).
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900&family=Hanken+Grotesk:wght@400;500;600;700&family=Saira+Condensed:wght@500;600;700;800&display=swap');

:root {
  /* ---- Brand: Teal (primary) ---------------------------- */
  --teal-900:#06363C;
  --teal-800:#084953;
  --teal-700:#0A6470;
  --teal-600:#0295A5;   /* base — from logo */
  --teal-500:#0FA9B8;
  --teal-400:#3CC0CD;
  --teal-300:#7FD7E0;
  --teal-200:#B4E8ED;
  --teal-100:#D9F2F5;
  --teal-50: #EFFAFB;

  /* ---- Brand: Lime (energy / accent) -------------------- */
  --lime-700:#6F9C0A;
  --lime-600:#8CC40F;
  --lime-500:#ADEF1C;   /* base — from logo */
  --lime-400:#C2F44E;
  --lime-300:#D5F884;
  --lime-200:#E6FBB4;
  --lime-100:#F2FDD9;

  /* ---- Ink / neutrals (teal-tinted slate) --------------- */
  --ink-900:#0C1A1D;    /* headings / strong text */
  --ink-800:#16292C;
  --ink-700:#2B3E41;    /* body text */
  --ink-600:#445A5D;
  --ink-500:#637679;    /* secondary text */
  --ink-400:#8A9B9D;
  --ink-300:#B3C0C1;    /* borders strong */
  --ink-200:#D7DFDF;    /* borders / dividers */
  --ink-100:#EAEFEF;    /* subtle fills */
  --paper:  #F6F8F7;    /* page background */
  --white:  #FFFFFF;

  /* ---- Semantic ----------------------------------------- */
  --success:#1F8A5B;
  --success-bg:#E4F5EC;
  --warning:#E8A317;
  --warning-bg:#FDF1D8;
  --danger:#D64545;
  --danger-bg:#FBE6E6;
  --info:var(--teal-600);
  --info-bg:var(--teal-50);

  /* ---- Semantic surface roles --------------------------- */
  --bg:            var(--paper);
  --surface:       var(--white);
  --surface-sunken:var(--ink-100);
  --fg1:           var(--ink-900);   /* primary text */
  --fg2:           var(--ink-700);   /* body */
  --fg3:           var(--ink-500);   /* muted */
  --on-teal:       #EAFBFD;          /* text on teal surfaces */
  --on-lime:       var(--ink-900);   /* text on lime surfaces */
  --border:        var(--ink-200);
  --border-strong: var(--ink-300);
  --primary:       var(--teal-600);
  --primary-hover: var(--teal-700);
  --accent:        var(--lime-500);
  --accent-hover:  var(--lime-600);
  --ring:          color-mix(in oklch, var(--teal-600) 45%, transparent);

  /* ---- Type families ------------------------------------ */
  --font-display: 'Archivo', system-ui, sans-serif;       /* headlines */
  --font-body:    'Hanken Grotesk', system-ui, sans-serif;/* body / UI  */
  --font-accent:  'Saira Condensed', 'Archivo', sans-serif;/* eyebrows, stats, race numbers */

  /* ---- Type scale (fluid-ish, rem) ---------------------- */
  --text-xs:   0.75rem;   /* 12 */
  --text-sm:   0.875rem;  /* 14 */
  --text-base: 1rem;      /* 16 */
  --text-md:   1.125rem;  /* 18 */
  --text-lg:   1.375rem;  /* 22 */
  --text-xl:   1.75rem;   /* 28 */
  --text-2xl:  2.25rem;   /* 36 */
  --text-3xl:  3rem;      /* 48 */
  --text-4xl:  4rem;      /* 64 */
  --text-5xl:  5.25rem;   /* 84 */

  --leading-tight:1.05;
  --leading-snug: 1.2;
  --leading-normal:1.55;

  /* ---- Spacing (4px base) ------------------------------- */
  --space-1:4px;  --space-2:8px;  --space-3:12px; --space-4:16px;
  --space-5:20px; --space-6:24px; --space-8:32px; --space-10:40px;
  --space-12:48px; --space-16:64px; --space-20:80px; --space-24:96px;
  --space-32:128px;

  /* ---- Radii -------------------------------------------- */
  --radius-xs:4px;
  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:18px;
  --radius-xl:28px;
  --radius-pill:999px;

  /* ---- Shadows (soft, teal-tinted) ---------------------- */
  --shadow-sm: 0 1px 2px rgba(12,26,29,.06), 0 1px 1px rgba(12,26,29,.04);
  --shadow-md: 0 6px 18px rgba(12,26,29,.08), 0 2px 6px rgba(12,26,29,.05);
  --shadow-lg: 0 18px 44px rgba(6,54,60,.16), 0 6px 14px rgba(6,54,60,.08);
  --shadow-teal:0 14px 30px rgba(2,149,165,.28);
  --shadow-lime:0 12px 26px rgba(140,196,15,.40);

  /* ---- Motion ------------------------------------------- */
  --ease-out: cubic-bezier(.22,.61,.36,1);
  --ease-in-out: cubic-bezier(.65,.05,.36,1);
  --dur-fast:120ms;
  --dur:200ms;
  --dur-slow:360ms;
}

/* ============================================================
   Semantic element styles — apply with the .mq scope or globally
   ============================================================ */
.mq-h1, .mq h1 {
  font-family:var(--font-display); font-weight:800;
  font-size:var(--text-4xl); line-height:var(--leading-tight);
  letter-spacing:-.02em; color:var(--fg1); margin:0;
}
.mq-h2, .mq h2 {
  font-family:var(--font-display); font-weight:800;
  font-size:var(--text-2xl); line-height:var(--leading-snug);
  letter-spacing:-.015em; color:var(--fg1); margin:0;
}
.mq-h3, .mq h3 {
  font-family:var(--font-display); font-weight:700;
  font-size:var(--text-xl); line-height:var(--leading-snug);
  letter-spacing:-.01em; color:var(--fg1); margin:0;
}
.mq-h4 {
  font-family:var(--font-display); font-weight:700;
  font-size:var(--text-lg); line-height:var(--leading-snug);
  color:var(--fg1); margin:0;
}
.mq-eyebrow {
  font-family:var(--font-accent); font-weight:700;
  font-size:var(--text-sm); letter-spacing:.14em; text-transform:uppercase;
  color:var(--teal-600);
}
.mq-stat {
  font-family:var(--font-accent); font-weight:800;
  font-size:var(--text-4xl); line-height:1; letter-spacing:.01em;
  color:var(--fg1);
}
.mq-lead {
  font-family:var(--font-body); font-weight:400;
  font-size:var(--text-md); line-height:var(--leading-normal); color:var(--fg2);
}
.mq-p, .mq p {
  font-family:var(--font-body); font-weight:400;
  font-size:var(--text-base); line-height:var(--leading-normal); color:var(--fg2); margin:0;
}
.mq-small {
  font-family:var(--font-body); font-size:var(--text-sm); color:var(--fg3);
}
.mq-mono, .mq code {
  font-family:'Saira Condensed', ui-monospace, monospace; letter-spacing:.02em;
}

/* ============================================================
   Ciclismo Marroquino — UI kit del sitio (site.css)
   Componentes + layout. Tokens vienen de colors_and_type.css.
   ============================================================ */

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg2);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit}

/* ---- layout ---- */
.wrap{max-width:1200px;margin:0 auto;padding:0 28px}
.section{padding:88px 0}
.section--tight{padding:56px 0}
.eyebrow{font-family:var(--font-accent);font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-600)}
.eyebrow--light{color:var(--lime-400)}
.sec-head{max-width:660px;margin-bottom:40px}
.sec-head h2{font-family:var(--font-display);font-weight:800;font-size:clamp(30px,4vw,46px);line-height:1.08;letter-spacing:-.02em;color:var(--fg1);margin:14px 0 0}
.sec-head p{font-size:18px;line-height:1.55;color:var(--fg2);margin:16px 0 0}
.center{text-align:center;margin-left:auto;margin-right:auto}

/* ---- buttons ---- */
.btn{font-family:var(--font-display);font-weight:700;font-size:15px;border:none;cursor:pointer;border-radius:var(--radius-pill);
  padding:13px 24px;display:inline-flex;align-items:center;gap:9px;transition:transform var(--dur-fast) var(--ease-out),background var(--dur) var(--ease-out),box-shadow var(--dur) var(--ease-out);white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn i{width:18px;height:18px}
.btn--accent{background:var(--lime-500);color:var(--on-lime);box-shadow:var(--shadow-lime)}
.btn--accent:hover{background:var(--lime-600)}
.btn--primary{background:var(--teal-600);color:var(--on-teal);box-shadow:var(--shadow-teal)}
.btn--primary:hover{background:var(--teal-700)}
.btn--ghost{background:transparent;color:var(--teal-700);border:2px solid var(--teal-600);padding:11px 22px}
.btn--ghost:hover{background:var(--teal-50)}
.btn--onteal{background:rgba(255,255,255,.12);color:#fff;border:2px solid rgba(255,255,255,.4);padding:11px 22px}
.btn--onteal:hover{background:rgba(255,255,255,.22)}
.btn--lg{padding:16px 30px;font-size:17px}
.btn--sm{padding:9px 17px;font-size:13px}

/* ---- header ---- */
.hdr{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.hdr__in{display:flex;align-items:center;justify-content:space-between;height:74px}
.hdr__logo{display:flex;align-items:center;gap:11px;cursor:pointer}
.hdr__logo img{height:42px;width:auto}
.hdr__nav{display:flex;gap:6px;align-items:center}
.navlink{font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--ink-700);padding:9px 14px;border-radius:var(--radius-sm);cursor:pointer;transition:color var(--dur),background var(--dur)}
.navlink:hover{color:var(--teal-700);background:var(--teal-50)}
.navlink.active{color:var(--teal-700)}
.hdr__cta{display:flex;align-items:center;gap:10px}
.hdr__phone{display:flex;align-items:center;gap:7px;font-family:var(--font-accent);font-weight:700;font-size:15px;color:var(--ink-700)}

/* ---- hero ---- */
.hero{position:relative;overflow:hidden;background:var(--teal-800)}
.hero__bg{position:absolute;inset:0}
.hero__overlay{position:absolute;inset:0;background:linear-gradient(100deg,rgba(6,54,60,.92) 0%,rgba(8,73,83,.74) 45%,rgba(2,149,165,.34) 100%)}
.hero__in{position:relative;padding:96px 0 132px;max-width:680px}
.hero h1{font-family:var(--font-display);font-weight:900;font-size:clamp(40px,6.4vw,80px);line-height:.98;letter-spacing:-.025em;color:#fff;margin:18px 0 0}
.hero h1 .hl{color:var(--lime-500)}
.hero p{font-size:clamp(17px,1.6vw,21px);line-height:1.5;color:#d8eef1;margin:22px 0 0;max-width:560px}
.hero__btns{display:flex;gap:14px;margin-top:34px;flex-wrap:wrap}
.hero__stats{display:flex;gap:40px;margin-top:54px;flex-wrap:wrap}
.hero__stats .n{font-family:var(--font-accent);font-weight:800;font-size:40px;line-height:1;color:var(--lime-500)}
.hero__stats .l{font-size:13px;letter-spacing:.04em;color:#bfe3e8;margin-top:4px;text-transform:uppercase;font-family:var(--font-accent);font-weight:600}
/* montañas motif */
.peaks{position:absolute;left:0;right:0;bottom:-1px;height:60px;display:block}

/* ---- trust strip ---- */
.trust{background:var(--white);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.trust__in{display:flex;align-items:center;gap:28px;padding:24px 0;flex-wrap:wrap;justify-content:center}
.trust__lbl{font-family:var(--font-accent);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:12px;color:var(--ink-400)}
.brandchip{font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:.02em;color:var(--ink-400);transition:color var(--dur)}
.trust__in:hover .brandchip{color:var(--ink-300)}
.brandchip:hover{color:var(--teal-600)!important}
.brandlogo{height:26px;width:auto;object-fit:contain;filter:grayscale(1);opacity:.5;transition:filter var(--dur),opacity var(--dur)}
.brandlogo:hover{filter:grayscale(0);opacity:1}

/* ---- cards / categories ---- */
.grid-cards{display:grid;gap:22px}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;
  box-shadow:var(--shadow-sm);transition:transform var(--dur) var(--ease-out),box-shadow var(--dur) var(--ease-out);cursor:pointer}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.card__body{padding:20px}
.card__body h3{font-family:var(--font-display);font-weight:700;font-size:21px;color:var(--fg1);margin:0}
.card__body p{font-size:14.5px;color:var(--fg3);margin:7px 0 0;line-height:1.5}
.card__link{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--teal-700)}
.card:hover .card__link i{transform:translateX(3px)}
.card__link i{width:16px;height:16px;transition:transform var(--dur)}

/* ---- placeholder (foto pendiente) ---- */
.ph{position:relative;background:
   repeating-linear-gradient(135deg,var(--teal-50),var(--teal-50) 14px,var(--teal-100) 14px,var(--teal-100) 28px);
   display:flex;align-items:center;justify-content:center;color:var(--teal-700);overflow:hidden}
.ph--dark{background:repeating-linear-gradient(135deg,var(--teal-800),var(--teal-800) 14px,var(--teal-700) 14px,var(--teal-700) 28px);color:#bfe3e8}
.ph__tag{display:flex;flex-direction:column;align-items:center;gap:8px;font-family:var(--font-accent);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:12px;text-align:center;padding:8px 14px}
.ph__tag i{width:26px;height:26px;opacity:.8}
/* full-bleed hero placeholders: park the label in a corner, not over content */
.hero__bg .ph__tag{position:absolute;top:16px;right:18px;flex-direction:row;gap:7px;opacity:.55;font-size:11px}
.hero__bg .ph__tag i{width:16px;height:16px}

/* ---- taller / services ---- */
.svc{display:flex;gap:16px;align-items:flex-start;padding:22px;background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);transition:box-shadow var(--dur)}
.svc:hover{box-shadow:var(--shadow-md)}
.svc__ico{flex:none;width:48px;height:48px;border-radius:var(--radius-md);background:var(--teal-50);color:var(--teal-600);display:flex;align-items:center;justify-content:center}
.svc__ico i{width:24px;height:24px}
.svc h4{font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--fg1);margin:0 0 5px}
.svc p{font-size:14px;color:var(--fg3);margin:0;line-height:1.5}

/* ---- teal feature band ---- */
.band{position:relative;background:var(--teal-700);color:#eafbfd;overflow:hidden}
.band h2{font-family:var(--font-display);font-weight:800;font-size:clamp(28px,3.6vw,44px);line-height:1.08;letter-spacing:-.02em;color:#fff;margin:14px 0 0}
.band p{font-size:18px;line-height:1.6;color:#cdeef2;margin:18px 0 0}
.band__deco{position:absolute;right:-60px;top:-60px;width:340px;height:340px;border-radius:50%;background:rgba(173,239,28,.10)}

/* ---- equipos / events ---- */
.team{border-radius:var(--radius-lg);overflow:hidden;position:relative}
.team__cap{position:absolute;left:0;right:0;bottom:0;padding:22px;background:linear-gradient(0deg,rgba(6,54,60,.92),transparent)}
.team__cap h3{font-family:var(--font-display);font-weight:800;font-size:24px;color:#fff;margin:0}
.team__cap p{font-size:14px;color:#cdeef2;margin:6px 0 0}
.eventrow{display:flex;align-items:center;gap:20px;padding:18px 22px;background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg)}
.eventrow+.eventrow{margin-top:12px}
.evdate{flex:none;text-align:center;width:62px}
.evdate .d{font-family:var(--font-accent);font-weight:800;font-size:30px;color:var(--teal-700);line-height:1}
.evdate .m{font-family:var(--font-accent);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-400)}
.eventrow h4{font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--fg1);margin:0}
.eventrow .meta{font-size:13.5px;color:var(--fg3);margin-top:3px;display:flex;gap:14px;flex-wrap:wrap}
.eventrow .meta span{display:inline-flex;align-items:center;gap:5px}
.eventrow .meta i{width:14px;height:14px}

/* ---- forms ---- */
.field label{display:block;font-family:var(--font-accent);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:11px;color:var(--ink-500);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;font-family:var(--font-body);font-size:15px;color:var(--ink-800);background:var(--white);
  border:1.5px solid var(--border-strong);border-radius:var(--radius-md);padding:12px 14px;outline:none;transition:border var(--dur),box-shadow var(--dur)}
.field textarea{resize:vertical;min-height:110px}
.field input::placeholder,.field textarea::placeholder{color:var(--ink-400)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal-600);box-shadow:0 0 0 3px var(--ring)}
.field+.field{margin-top:16px}

/* ---- badge ---- */
.badge{font-family:var(--font-accent);font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:11px;padding:5px 11px;border-radius:var(--radius-sm);display:inline-flex;align-items:center;gap:5px}
.badge--auth{background:var(--teal-50);color:var(--teal-700);border:1px solid var(--teal-200)}
.badge--new{background:var(--lime-500);color:var(--on-lime)}
.badge--off{background:var(--danger-bg);color:var(--danger)}

/* ---- info cards (contacto) ---- */
.info{display:flex;gap:13px;align-items:flex-start}
.info+.info{margin-top:20px}
.info__ico{flex:none;width:42px;height:42px;border-radius:var(--radius-md);background:var(--lime-100);color:var(--lime-700);display:flex;align-items:center;justify-content:center}
.info__ico i{width:20px;height:20px}
.info b{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--fg1);display:block;margin-bottom:2px}
.info span{font-size:14.5px;color:var(--fg3);line-height:1.5}

/* ---- footer ---- */
.ftr{background:var(--ink-900);color:#aebdbe;padding:64px 0 30px}
.ftr__grid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1.2fr;gap:36px}
.ftr h5{font-family:var(--font-accent);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:12px;color:#6f8284;margin:0 0 16px}
.ftr a{display:block;font-size:14.5px;color:#c4d2d3;padding:5px 0;transition:color var(--dur)}
.ftr a:hover{color:var(--lime-400)}
.ftr__logo{height:46px;margin-bottom:16px;background:#fff;padding:8px 10px;border-radius:var(--radius-md);width:max-content}
.ftr__logo img{height:44px}
.ftr__bottom{margin-top:44px;padding-top:22px;border-top:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;font-size:13px;color:#6f8284;flex-wrap:wrap;gap:10px}
.social{display:flex;gap:10px;margin-top:8px}
.social a{width:40px;height:40px;border-radius:var(--radius-pill);background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;padding:0}
.social a:hover{background:var(--teal-600);color:#fff}
.social i{width:19px;height:19px}

/* ---- store mockup banner ---- */
.fase2{background:var(--lime-100);border:1px dashed var(--lime-600);color:var(--lime-700);
  font-family:var(--font-accent);font-weight:700;letter-spacing:.04em;font-size:13px;
  padding:10px 18px;border-radius:var(--radius-pill);display:inline-flex;align-items:center;gap:8px}
.fase2 i{width:16px;height:16px}

/* ---- store ---- */
.prodcard{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm);transition:transform var(--dur),box-shadow var(--dur);cursor:pointer;position:relative}
.prodcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.prodcard__img{aspect-ratio:1/1;background:var(--ink-100)}
.prodcard__b{padding:16px}
.prodcard__cat{font-family:var(--font-accent);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11px;color:var(--teal-600)}
.prodcard__t{font-family:var(--font-display);font-weight:700;font-size:16px;color:var(--fg1);margin:5px 0 0;line-height:1.25}
.prodcard__price{font-family:var(--font-accent);font-weight:800;font-size:22px;color:var(--fg1);margin-top:10px;display:flex;align-items:baseline;gap:8px}
.prodcard__price s{font-size:14px;color:var(--ink-400);font-weight:600}
.prodcard__badge{position:absolute;top:12px;left:12px}
.cartbtn{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:var(--radius-pill);background:var(--lime-500);color:var(--on-lime);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transform:translateY(-6px);transition:opacity var(--dur),transform var(--dur),background var(--dur)}
.prodcard:hover .cartbtn{opacity:1;transform:translateY(0)}
.cartbtn:hover{background:var(--lime-600)}
.cartbtn i{width:19px;height:19px}

/* cart drawer */
.drawer-back{position:fixed;inset:0;background:rgba(6,26,29,.45);z-index:90;opacity:0;pointer-events:none;transition:opacity var(--dur)}
.drawer-back.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:380px;max-width:90vw;background:var(--white);z-index:91;transform:translateX(100%);transition:transform var(--dur-slow) var(--ease-out);display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.drawer.open{transform:translateX(0)}
.drawer__hd{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--border)}
.drawer__hd h3{font-family:var(--font-display);font-weight:800;font-size:20px;margin:0;color:var(--fg1)}
.iconbtn{width:38px;height:38px;border-radius:var(--radius-pill);background:var(--ink-100);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink-700)}
.iconbtn:hover{background:var(--ink-200)}
.iconbtn i{width:19px;height:19px}
.cartitem{display:flex;gap:13px;padding:16px 22px;border-bottom:1px solid var(--border)}
.cartitem__img{width:62px;height:62px;border-radius:var(--radius-md);background:var(--ink-100);flex:none}
.cartitem b{font-family:var(--font-display);font-weight:700;font-size:14.5px;color:var(--fg1);display:block}
.cartitem .pr{font-family:var(--font-accent);font-weight:800;color:var(--teal-700);margin-top:4px}
.drawer__ft{margin-top:auto;padding:22px;border-top:1px solid var(--border)}
.drawer__total{display:flex;justify-content:space-between;font-family:var(--font-display);font-weight:800;font-size:20px;color:var(--fg1);margin-bottom:16px}

/* cart pill in header */
.cartpill{position:relative;width:46px;height:46px;border-radius:var(--radius-pill);background:var(--teal-600);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cartpill:hover{background:var(--teal-700)}
.cartpill i{width:21px;height:21px}
.cartpill__n{position:absolute;top:-4px;right:-4px;min-width:21px;height:21px;border-radius:var(--radius-pill);background:var(--lime-500);color:var(--on-lime);font-family:var(--font-accent);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid #fff}

/* ---- responsive ---- */
@media(max-width:980px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(2,1fr)}
  .ftr__grid{grid-template-columns:1fr 1fr}
  .hdr__nav{display:none}
}
@media(max-width:620px){
  .g4,.g3,.g2,.ftr__grid{grid-template-columns:1fr}
}

/* ---- entrance ---- */
@media(prefers-reduced-motion:no-preference){
  .reveal{opacity:0;transform:translateY(16px);animation:rise .6s var(--ease-out) forwards}
  @keyframes rise{to{opacity:1;transform:none}}
}

  </style>

<script type="text/babel">
/* Ciclismo Marroquino — core atoms + Lucide helper */
const { useState, useEffect, useRef, useCallback } = React;

/* Re-render Lucide icons after DOM updates */
function useLucide(dep) {
  useEffect(() => {
    if (window.lucide && window.lucide.createIcons) window.lucide.createIcons();
  });
}
function Icon({ name, className, style }) {
  return <i data-lucide={name} className={className} style={style}></i>;
}

function Button({ variant = "accent", size, children, icon, iconRight, onClick }) {
  const cls = ["btn", `btn--${variant}`, size === "lg" ? "btn--lg" : size === "sm" ? "btn--sm" : ""]
    .filter(Boolean).join(" ");
  return (
    <button className={cls} onClick={onClick}>
      {icon && <Icon name={icon} />}
      {children}
      {iconRight && <Icon name={iconRight} />}
    </button>
  );
}

function Eyebrow({ children, light }) {
  return <div className={"eyebrow" + (light ? " eyebrow--light" : "")}>{children}</div>;
}

function Badge({ kind = "auth", children }) {
  return <span className={`badge badge--${kind}`}>{children}</span>;
}

/* Photo placeholder — "foto pendiente" */
function Ph({ label = "Foto", icon = "image", dark, style, className = "" }) {
  return (
    <div className={`ph ${dark ? "ph--dark" : ""} ${className}`} style={style}>
      <div className="ph__tag"><Icon name={icon} /><span>{label}</span></div>
    </div>
  );
}

function SectionHead({ eyebrow, title, sub, center, light }) {
  return (
    <div className={"sec-head" + (center ? " center" : "")}>
      {eyebrow && <Eyebrow light={light}>{eyebrow}</Eyebrow>}
      <h2 style={light ? { color: "#fff" } : null}>{title}</h2>
      {sub && <p style={light ? { color: "#cdeef2" } : null}>{sub}</p>}
    </div>
  );
}

/* SVG montañas motif — silueta inspirada en el logo (no decorativo invasivo) */
function Peaks({ fill = "#F6F8F7" }) {
  return (
    <svg className="peaks" viewBox="0 0 1200 60" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0,60 L0,42 L210,8 L360,34 L520,2 L700,40 L880,12 L1040,38 L1200,16 L1200,60 Z" fill={fill} />
    </svg>
  );
}

                  <select><option>Quiero cotizar una bici</option><option>Necesito un servicio de taller</option><option>Refacciones / accesorios</option><option>Equipos y eventos</option><option>Otro</option></select></div>
                <div className="field"><label>Comentarios</label><textarea placeholder="Dinos lo que piensas."></textarea></div>
                <div style={{ marginTop: 20 }}><Button variant="accent" size="lg" icon="send">Enviar mensaje</Button></div>
              </form>
            )}
          </div>
          <div>
            <div className="info"><div className="info__ico"><Icon name="map-pin" /></div><div><b>Dirección</b><span>Av. Ahuejotes 9, Ampl. San Marcos Norte, Xochimilco, CDMX, C.P. 16038</span></div></div>
            <div className="info"><div className="info__ico"><Icon name="phone" /></div><div><b>Teléfono</b><span>55 5676 2366</span></div></div>
            <div className="info"><div className="info__ico"><Icon name="clock" /></div><div><b>Horario</b><span>Lunes a Sábado · 10:00–19:00<br />Domingo · 10:30–15:00</span></div></div>
            <div className="info"><div className="info__ico"><IgIcon /></div><div><b>Síguenos</b><span>@ciclismo_marroquino · Facebook: bicicletasmarroquino</span></div></div>
            <Ph label="Mapa — Google Maps embed" icon="map" style={{ aspectRatio: "16/10", borderRadius: "var(--radius-lg)", marginTop: 24 }} />
          </div>
        </div>
      </section>
    </div>
  );
}

Object.assign(window, { PageHero, ServiciosPage, EquiposPage, HistoriaPage, ContactoPage, EVENTS, VALUES });

</script>

<script type="text/babel">
/* Ciclismo Marroquino — MOCKUP Tienda en línea (Fase 2, propuesta a futuro) */

const PRODUCTS = [
  { id: 1, cat: "Ruta", t: "Orbea Avant H40", price: 28990, was: null, badge: "new" },
  { id: 2, cat: "MTB", t: "Giant Talon 29 2", price: 17987, was: 20440, badge: "off" },
  { id: 3, cat: "Urbana", t: "Benotto City 700c", price: 7490, was: null, badge: null },
  { id: 4, cat: "Accesorios", t: "Casco MET Idolo", price: 1980, was: null, badge: null },
  { id: 5, cat: "Refacciones", t: "Grupo Shimano 105", price: 9450, was: null, badge: "new" },
  { id: 6, cat: "Accesorios", t: "Llanta Michelin Dynamic", price: 540, was: 690, badge: "off" },
  { id: 7, cat: "MTB", t: "Cassette Shimano CS-HG200", price: 620, was: null, badge: null },
  { id: 8, cat: "Infantil", t: "Benotto Rodada 20", price: 3290, was: null, badge: null },
];
const FILTERS = ["Todo", "Ruta", "MTB", "Urbana", "Infantil", "Accesorios", "Refacciones"];
const mxn = n => "$" + n.toLocaleString("es-MX");

function TiendaPage() {
  const [filter, setFilter] = useState("Todo");
  const [cart, setCart] = useState([]);
  const [open, setOpen] = useState(false);
  const add = (p) => { setCart(c => [...c, p]); setOpen(true); };
  const remove = (i) => setCart(c => c.filter((_, idx) => idx !== i));
  const total = cart.reduce((s, p) => s + p.price, 0);
  const list = filter === "Todo" ? PRODUCTS : PRODUCTS.filter(p => p.cat === filter);

  return (
    <div>
      {/* Fase 2 notice */}
      <div style={{ background: "var(--lime-100)", borderBottom: "1px solid var(--lime-300)" }}>
        <div className="wrap" style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 16, padding: "14px 28px", flexWrap: "wrap" }}>
          <span className="fase2"><Icon name="flask-conical" /> Vista previa — Tienda en línea · Fase 2 (propuesta a futuro)</span>
          <span style={{ fontSize: 13.5, color: "var(--lime-700)", fontFamily: "var(--font-body)" }}>Hoy el sitio es informativo; el carrito es demostrativo.</span>
        </div>
      </div>

      {/* Store header row */}
      <section className="wrap" style={{ padding: "44px 28px 0" }}>
        <Eyebrow>Catálogo</Eyebrow>
        <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", gap: 20, flexWrap: "wrap", marginTop: 12 }}>
          <h1 style={{ fontFamily: "var(--font-display)", fontWeight: 800, fontSize: "clamp(30px,4vw,46px)", letterSpacing: "-.02em", color: "var(--fg1)", margin: 0 }}>La tienda</h1>
          <button className="cartpill" onClick={() => setOpen(true)} aria-label="Carrito">
            <Icon name="shopping-cart" />
            {cart.length > 0 && <span className="cartpill__n">{cart.length}</span>}
          </button>
        </div>
        {/* filters */}
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", margin: "26px 0 6px" }}>
          {FILTERS.map(f => (
            <span key={f} onClick={() => setFilter(f)}
              style={{ fontFamily: "var(--font-accent)", fontWeight: 700, fontSize: 13, padding: "8px 16px", borderRadius: "var(--radius-pill)", cursor: "pointer",
                border: "1.5px solid " + (filter === f ? "var(--teal-600)" : "var(--border-strong)"),
                background: filter === f ? "var(--teal-600)" : "var(--white)", color: filter === f ? "var(--on-teal)" : "var(--ink-600)" }}>
              {f}
            </span>
          ))}
        </div>
      </section>

      {/* grid */}
      <section className="section wrap" style={{ paddingTop: 28 }}>
        <div className="grid-cards g4">
          {list.map(p => (
            <div key={p.id} className="prodcard">
              {p.badge === "new" && <span className="prodcard__badge"><Badge kind="new">Nuevo</Badge></span>}
              {p.badge === "off" && <span className="prodcard__badge"><Badge kind="off">Oferta</Badge></span>}
              <button className="cartbtn" onClick={() => add(p)} aria-label="Agregar"><Icon name="plus" /></button>
              <Ph className="prodcard__img" label={p.t} icon="image" />
              <div className="prodcard__b">
                <div className="prodcard__cat">{p.cat}</div>
                <div className="prodcard__t">{p.t}</div>
                <div className="prodcard__price">{mxn(p.price)}{p.was && <s>{mxn(p.was)}</s>}</div>
              </div>
            </div>
          ))}
        </div>
      </section>

      {/* drawer */}
      <div className={"drawer-back" + (open ? " open" : "")} onClick={() => setOpen(false)}></div>
      <aside className={"drawer" + (open ? " open" : "")}>
        <div className="drawer__hd">
          <h3>Tu carrito</h3>
          <button className="iconbtn" onClick={() => setOpen(false)}><Icon name="x" /></button>
        </div>
        <div style={{ flex: 1, overflowY: "auto" }}>
          {cart.length === 0 ? (
            <div style={{ padding: 40, textAlign: "center", color: "var(--fg3)" }}>
              <Icon name="shopping-cart" style={{ width: 34, height: 34, opacity: .4 }} />
              <p style={{ marginTop: 12 }}>Tu carrito está vacío.</p>
            </div>
          ) : cart.map((p, i) => (
            <div key={i} className="cartitem">
              <Ph className="cartitem__img" label="" icon="image" />
              <div style={{ flex: 1 }}>
                <b>{p.t}</b><div style={{ fontSize: 12.5, color: "var(--fg3)" }}>{p.cat}</div>
                <div className="pr">{mxn(p.price)}</div>
              </div>
              <button className="iconbtn" onClick={() => remove(i)} style={{ width: 32, height: 32 }}><Icon name="trash-2" style={{ width: 16, height: 16 }} /></button>
            </div>
          ))}
        </div>
        {cart.length > 0 && (
          <div className="drawer__ft">
            <div className="drawer__total"><span>Total</span><span>{mxn(total)}</span></div>
            <Button variant="accent" size="lg" icon="credit-card">Pagar</Button>
          </div>
        )}
      </aside>
    </div>
  );
}

Object.assign(window, { TiendaPage, PRODUCTS });

</script>

<script type="text/babel">
/* Ciclismo Marroquino — app shell / router */

function App() {
  const [page, setPage] = useState(window.__startPage || "home");
  const go = useCallback((p) => { setPage(p); window.scrollTo({ top: 0, behavior: "auto" }); }, []);
  useLucide(page);

  let view;
  switch (page) {
    case "servicios": view = <ServiciosPage go={go} />; break;
    case "equipos": view = <EquiposPage go={go} />; break;
    case "historia": view = <HistoriaPage go={go} />; break;
    case "contacto": view = <ContactoPage />; break;
    case "tienda": view = <TiendaPage />; break;
    default: view = <HomePage go={go} />;
  }

  return (
    <div>
      <Header page={page} go={go} />
      <main key={page}>{view}</main>
      <Footer go={go} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>

</body>
</html>
